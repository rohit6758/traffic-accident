<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Intelligence Predictor</title>
    <style>
        :root {
            --tangerine: #F28500;
            --tangerine-light: #FFA733;
            --yellowish: #FFD700;
            --yellow-light: #FFF8CC;
            --dark-text: #333333;
            --white: #FFFFFF;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--yellow-light);
            color: var(--dark-text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(242, 133, 0, 0.15);
            max-width: 500px;
            width: 100%;
            border-top: 6px solid var(--tangerine);
        }

        h1 {
            text-align: center;
            color: var(--tangerine);
            margin-top: 0;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-text);
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--yellowish);
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--yellowish), var(--tangerine));
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(242, 133, 0, 0.3);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background-color: #f9f9f9;
            border-left: 5px solid var(--tangerine);
            display: none; /* Hidden by default */
        }

        .result-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--tangerine);
        }

        .metric {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .high-risk {
            color: #d32f2f;
            font-weight: bold;
        }
        
        .low-risk {
            color: #2e7d32;
            font-weight: bold;
        }

    </style>
</head>
<body>

<div class="container">
    <h1>Traffic Intelligence</h1>
    
    <div class="form-group">
        <label for="hour">Time of Day</label>
        <select id="hour">
            <option value="0">12:00 AM (Midnight)</option>
            <option value="1">1:00 AM</option>
            <option value="2">2:00 AM</option>
            <option value="3">3:00 AM</option>
            <option value="4">4:00 AM</option>
            <option value="5">5:00 AM</option>
            <option value="6">6:00 AM</option>
            <option value="7">7:00 AM (Morning Rush)</option>
            <option value="8">8:00 AM (Morning Rush)</option>
            <option value="9">9:00 AM</option>
            <option value="10">10:00 AM</option>
            <option value="11">11:00 AM</option>
            <option value="12">12:00 PM (Noon)</option>
            <option value="13">1:00 PM</option>
            <option value="14" selected>2:00 PM</option>
            <option value="15">3:00 PM</option>
            <option value="16">4:00 PM (Evening Rush)</option>
            <option value="17">5:00 PM (Evening Rush)</option>
            <option value="18">6:00 PM (Evening Rush)</option>
            <option value="19">7:00 PM</option>
            <option value="20">8:00 PM</option>
            <option value="21">9:00 PM</option>
            <option value="22">10:00 PM</option>
            <option value="23">11:00 PM</option>
        </select>
    </div>

    <div class="form-group">
        <label for="temperature">Temperature (°C)</label>
        <input type="number" id="temperature" value="25">
    </div>

    <div class="form-group">
        <label for="weather">Weather Condition</label>
        <select id="weather">
            <option value="1">Clear</option>
            <option value="2">Cloudy</option>
            <option value="3">Rain</option>
            <option value="4">Snow</option>
        </select>
    </div>

    <div class="form-group">
        <label for="weekend">Is it the Weekend?</label>
        <select id="weekend">
            <option value="0">No (Weekday)</option>
            <option value="1">Yes (Weekend)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="road">Road Quality</label>
        <select id="road">
            <option value="1">Good</option>
            <option value="2">Fair</option>
            <option value="3">Poor</option>
        </select>
    </div>

    <button onclick="analyzeTraffic()">Predict Traffic & Risk</button>

    <div class="result-box" id="resultBox">
        <div class="result-title">Prediction Results:</div>
        <div class="metric">🚗 Expected Traffic Volume: <strong id="volumeResult">...</strong> vehicles</div>
        <div class="metric">⚠️ Accident Risk: <span id="riskResult">...</span></div>
    </div>
</div>

<script>
    function analyzeTraffic() {
        // 1. Get values from the inputs
        const data = {
            hour: parseInt(document.getElementById('hour').value),
            temperature: parseFloat(document.getElementById('temperature').value),
            weather_code: parseInt(document.getElementById('weather').value),
            is_weekend: parseInt(document.getElementById('weekend').value),
            road_quality: parseInt(document.getElementById('road').value)
        };

        // 2. Change button text to show loading
        const btn = document.querySelector('button');
        btn.innerText = "Analyzing...";

        // 3. Send POST request to Flask API
        fetch("http://localhost:5000/predict", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            // Restore button text
            btn.innerText = "Predict Traffic & Risk";
            
            if(data.success) {
                // Show the results box
                document.getElementById('resultBox').style.display = 'block';
                
                // Update Volume
                document.getElementById('volumeResult').innerText = data.traffic_volume.toLocaleString();
                
                // Update Risk with colors
                const riskElement = document.getElementById('riskResult');
                if(data.accident_risk === 1) {
                    riskElement.innerText = "HIGH RISK";
                    riskElement.className = "high-risk";
                } else {
                    riskElement.innerText = "LOW RISK";
                    riskElement.className = "low-risk";
                }
            } else {
                alert("Error from API: " + data.error);
            }
        })
        .catch(error => {
            btn.innerText = "Predict Traffic & Risk";
            alert("Could not connect to Flask Server. Make sure 'python server.py' is running!");
            console.error(error);
        });
    }
</script>

</body>
</html>
